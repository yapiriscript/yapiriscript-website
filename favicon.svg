<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <style>
      @font-face {
        font-family: 'Yapiri';
        src: url('Yapiri.woff2') format('woff2'), url('Yapiri.ttf') format('truetype');
      }
    </style>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#2a1e0a"/>
      <stop offset="100%" stop-color="#0e0c06"/>
    </radialGradient>
    <radialGradient id="goldGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#e8c060"/>
      <stop offset="60%" stop-color="#c9922a"/>
      <stop offset="100%" stop-color="#8a5f10"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <clipPath id="circle">
      <circle cx="256" cy="256" r="240"/>
    </clipPath>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGrad)"/>

  <!-- Subtle ring border -->
  <circle cx="256" cy="256" r="238" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.6"/>
  <circle cx="256" cy="256" r="228" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.25"/>

  <!-- Gold glow behind glyphs -->
  <ellipse cx="256" cy="265" rx="130" ry="110" fill="#c9922a" opacity="0.07" filter="url(#glow)"/>

  <!-- Decorative horizontal rule -->
  <line x1="108" y1="320" x2="404" y2="320" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.35"/>

  <!-- YS glyphs using Yapiri font -->
  <text
    x="256"
    y="305"
    font-family="Yapiri, serif"
    font-size="220"
    fill="url(#goldGrad)"
    text-anchor="middle"
    dominant-baseline="auto"
    filter="url(#glow)"
    letter-spacing="-8"
  >&#xE01C;&#xE016;</text>

  <!-- Small label -->
  <text
    x="256"
    y="358"
    font-family="'DM Mono', 'Courier New', monospace"
    font-size="26"
    fill="#c9922a"
    text-anchor="middle"
    letter-spacing="8"
    opacity="0.7"
  >YAPIRI</text>

</svg>
