<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#2a1e0a"/>
      <stop offset="100%" stop-color="#0e0c06"/>
    </radialGradient>
    <radialGradient id="gold" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#e8c060"/>
      <stop offset="60%" stop-color="#c9922a"/>
      <stop offset="100%" stop-color="#8a5f10"/>
    </radialGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>

  <!-- Gold ring border -->
  <circle cx="256" cy="256" r="238" fill="none" stroke="url(#gold)" stroke-width="3" opacity="0.6"/>

  <!-- Y glyph — left arm -->
  <line x1="148" y1="128" x2="228" y2="248" stroke="url(#gold)" stroke-width="38" stroke-linecap="round"/>
  <!-- Y glyph — right arm -->
  <line x1="308" y1="128" x2="228" y2="248" stroke="url(#gold)" stroke-width="38" stroke-linecap="round"/>
  <!-- Y glyph — stem -->
  <line x1="228" y1="248" x2="228" y2="348" stroke="url(#gold)" stroke-width="38" stroke-linecap="round"/>

  <!-- S glyph — top curve -->
  <path d="M 342 172 Q 402 150 392 212 Q 382 252 322 258" fill="none" stroke="url(#gold)" stroke-width="32" stroke-linecap="round"/>
  <!-- S glyph — bottom curve -->
  <path d="M 322 258 Q 262 264 272 318 Q 282 368 342 348" fill="none" stroke="url(#gold)" stroke-width="32" stroke-linecap="round"/>

  <!-- Bottom rule -->
  <line x1="108" y1="395" x2="404" y2="395" stroke="#c9922a" stroke-width="1.5" opacity="0.35"/>

  <!-- YAPIRI label -->
  <text x="256" y="456" font-family="Arial Narrow, Arial, sans-serif" font-size="50" font-weight="700" fill="#c9922a" text-anchor="middle" letter-spacing="9" opacity="0.75">YAPIRI</text>
</svg>
